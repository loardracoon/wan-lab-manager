name: build-and-deploy

# Builds both images on every push to main, pushes them to GHCR and pins the
# new tag in deploy/kustomization.yaml; Argo CD then rolls it out to K3s.
on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "argocd/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/loardracoon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/wan-lab-manager:${{ github.sha }}
            ${{ env.REGISTRY }}/wan-lab-manager:latest

      - name: Build and push webssh
        uses: docker/build-push-action@v6
        with:
          context: ./webssh
          push: true
          tags: |
            ${{ env.REGISTRY }}/wan-lab-manager-webssh:${{ github.sha }}
            ${{ env.REGISTRY }}/wan-lab-manager-webssh:latest

      - name: Pin the new tag for Argo CD
        run: |
          sed -i "s/^\(\s*newTag:\).*/\1 ${GITHUB_SHA}/" deploy/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: ${GITHUB_SHA::7}"
          git pull --rebase
          git push
